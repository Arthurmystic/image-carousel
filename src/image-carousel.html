<!-- image-carousel.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMAGE-CAROUSEL</title>
  </head>
  <body>
    <header>IMAGE CAROUSEL</header>
    <div id="img-container">
      <div id="arrows">
        <button id="previous">⬅️</button>
        <button id="next">➡️</button>
      </div>
      <div id="imgDiv">
        <img src="./img/1-capuccino.png" alt="cappuccino" />
        <img src="./img/2-chocolate-cake.png" alt="chocolate" />
        <img src="./img/3-salad-bowl.png" alt="saladBowl" />
        <img src="./img/4-sandwich.png" alt="sandwich" />
        <img
          src="./img/carolina-marinelli-PkbyxvkGWcU-unsplash.jpg"
          alt="carolina"
        />
        <img src="./img/chef.jpeg" alt="chef" />
        <img src="./img/happy-asian-customer.jpg" alt="asian" />
        <img src="./img/happy-aussi-lady.jpg" alt="aussi" />
        <img src="./img/happy-black-lady.jpg" alt="asian" />
      </div>
      <div id="scrollDots"></div>
    </div>
  </body>
</html>
